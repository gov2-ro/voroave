    <g>
      <rect x="478" y="130" width="245" height="64" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="600.5" y="157" font-family="'JetBrains Mono', monospace" font-weight="500">process_wikisource.py</tspan>
      <tspan x="600.5" y="179">Wikisource, 14.3M</tspan>
      </text>
    </g>
    <g>
      <rect x="478" y="202" width="245" height="64" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="600.5" y="229" font-family="'JetBrains Mono', monospace" font-weight="500">process_lumro.py</tspan>
      <tspan x="600.5" y="251">LUMRO novels, 5.07M</tspan>
      </text>
    </g>
    <rect x="749" y="96" width="265" height="108" rx="8" fill="none" stroke="#8a8278" stroke-width="1"/>
    <text fill="#18150f" font-size="18" font-weight="600" text-anchor="middle" x="881.5" y="120">modern panel</text>
    <g>
      <rect x="759" y="130" width="245" height="64" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="881.5" y="157" font-family="'JetBrains Mono', monospace" font-weight="500">process_culturax.py</tspan>
      <tspan x="881.5" y="179">CulturaX, 16.97B</tspan>
      </text>
    </g>
    <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="892" y="80">lexemes.db</text>
    <g>
