    </g>
    <g>
      <rect x="488" y="434" width="222" height="86" rx="8" fill="#ffffff" stroke="#8a8278" stroke-width="1.2" stroke-dasharray="5 4"/>
      <text fill="#5c5550" text-anchor="middle" font-size="18">
      <tspan x="599" y="461" font-family="'JetBrains Mono', monospace" font-weight="500">extract_meanings.py</tspan>
      <tspan x="599" y="483" font-family="'JetBrains Mono', monospace" font-weight="500">meanings.db</tspan>
      <tspan x="599" y="505">senses, from the dump</tspan>
