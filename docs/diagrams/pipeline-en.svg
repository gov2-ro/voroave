    <path d="M746,675 H782" marker-end="url(#pl-arrow-a)"/>
    <path d="M1022,675 H1058" marker-end="url(#pl-arrow-a)"/>
  </g>

  <!-- phase 1 -->
    <g>
      <rect x="24" y="24" width="216" height="32" rx="16" fill="#eaf0ff" stroke="#1a56db" stroke-width="1"/>
      <text fill="#15348f" text-anchor="middle" font-size="18" font-weight="600" x="132.0" y="46">phase 1 · dictionary</text>
    </g>
    <g>
      <rect x="24" y="66" width="370" height="64" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="209" y="93" font-family="'JetBrains Mono', monospace" font-weight="500">dex-database.sql</tspan>
      <tspan x="209" y="115">dexonline MySQL dump, 1.65 GB</tspan>
      </text>
    </g>
    <g>
      <rect x="24" y="166" width="370" height="268" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" font-size="18" font-weight="600" x="38" y="190">the four dictionary databases</text>
      <line x1="38" x2="380" y1="198" y2="198" stroke="#b9c8ec" stroke-width="1"/>
      <line x1="38" x2="380" y1="270" y2="270" stroke="#b9c8ec" stroke-width="1"/>
      <line x1="38" x2="380" y1="324" y2="324" stroke="#b9c8ec" stroke-width="1"/>
      <line x1="38" x2="380" y1="378" y2="378" stroke="#b9c8ec" stroke-width="1"/>
      <text fill="#18150f" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="500" x="38" y="216">lexemes.db</text>
      <text fill="#18150f" font-size="18" text-anchor="end" x="380" y="216">headwords, tags</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="238">extract_lexemes.py +</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="260">extract_taxonomy.py</text>
      <text fill="#18150f" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="500" x="38" y="292">inflected_forms.db</text>
      <text fill="#18150f" font-size="18" text-anchor="end" x="380" y="292">inflected forms</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="314">extract_inflected_forms.py</text>
      <text fill="#18150f" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="500" x="38" y="346">dict_sources.db</text>
      <text fill="#18150f" font-size="18" text-anchor="end" x="380" y="346">dictionaries, years</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="368">extract_dict_sources.py</text>
      <text fill="#18150f" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="500" x="38" y="400">definitions.db</text>
      <text fill="#18150f" font-size="18" text-anchor="end" x="380" y="400">definitions</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="422">extract_definitions.py</text>
    </g>
    <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="122" y="459">lexemes.db</text>
    <g>
      <rect x="24" y="472" width="370" height="86" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="209" y="499" font-family="'JetBrains Mono', monospace" font-weight="500">create_curated_list.py</tspan>
      <tspan x="209" y="521" font-family="'JetBrains Mono', monospace" font-weight="500">forgotten_words_curated.csv</tspan>
      <tspan x="209" y="543">candidates: the words to check</tspan>
      </text>
    </g>
  <!-- phase 2 -->
    <g>
      <rect x="468" y="24" width="176" height="32" rx="16" fill="#eaf0ff" stroke="#1a56db" stroke-width="1"/>
      <text fill="#15348f" text-anchor="middle" font-size="18" font-weight="600" x="556.0" y="46">phase 2 · corpora</text>
