    <path d="M1170,790 V730" marker-end="url(#pl-arrow-b)"/>
    <path d="M912,844 H882" marker-end="url(#pl-arrow-b)"/>
    <path d="M590,844 H560" marker-end="url(#pl-arrow-b)"/>
    <path d="M450,801 V776 H840 V730" marker-end="url(#pl-arrow-b)"/>
  </g>

  <!-- A: the evidence path that decides verdict and score -->
  <g fill="none" stroke="#1a56db" stroke-width="3">
    <path d="M110,130 V166" marker-end="url(#pl-arrow-a)"/>
    <path d="M110,434 V472" marker-end="url(#pl-arrow-a)"/>
    <path d="M110,558 V620" marker-end="url(#pl-arrow-a)"/>
