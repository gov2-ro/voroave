    </g>
    <g>
      <rect x="996" y="434" width="210" height="86" rx="8" fill="#ffffff" stroke="#8a8278" stroke-width="1.2" stroke-dasharray="5 4"/>
      <text fill="#5c5550" text-anchor="middle" font-size="18">
      <tspan x="1101" y="461" font-family="'JetBrains Mono', monospace" font-weight="500">scrape_synonyms.py</tspan>
      <tspan x="1101" y="483" font-family="'JetBrains Mono', monospace" font-weight="500">synonyms.db</tspan>
      <tspan x="1101" y="505">synonyms: dexonline.ro</tspan>
      </text>
    </g>
    <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="516" y="577">lexemes.db</text>
  <!-- phase 3 -->
    <text fill="#5c5550" font-size="18" text-anchor="end" x="314" y="612">all 4</text>
    <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="478" y="612">inflected_forms.db</text>
    <text fill="#5c5550" font-size="18" x="806" y="612">all 4</text>
    <g>
      <rect x="24" y="620" width="346" height="110" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="197" y="648" font-family="'JetBrains Mono', monospace" font-weight="500">validate_diachronic.py</tspan>
      <tspan x="197" y="670" font-family="'JetBrains Mono', monospace" font-weight="500">forgotten_words_diachronic.csv</tspan>
      <tspan x="197" y="692">a verdict for each word; rolls</tspan>
      <tspan x="197" y="714">forms up over the paradigm</tspan>
