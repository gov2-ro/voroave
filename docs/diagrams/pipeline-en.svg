      <tspan x="1118" y="145">reference only,</tspan>
      <tspan x="1118" y="167">in no panel,</tspan>
      <tspan x="1118" y="189">no part in verdicts</tspan>
      </text>
    </g>
    <g>
      <rect x="566" y="304" width="270" height="64" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="701" y="331" font-family="'JetBrains Mono', monospace" font-weight="500">corpus_frequencies.db</tspan>
      <tspan x="701" y="353">counts per form, per corpus</tspan>
      </text>
    </g>
  <!-- legend -->
    <line x1="1000" x2="1050" y1="228" y2="228" stroke="#1a56db" stroke-width="3"/>
    <line x1="1000" x2="1050" y1="288" y2="288" stroke="#5c5550" stroke-width="2" stroke-dasharray="7 5"/>
    <line x1="1000" x2="1050" y1="348" y2="348" stroke="#6f675f" stroke-width="1.6"/>
    <text fill="#18150f" font-size="18" x="1000" y="248">evidence: decides the</text>
    <text fill="#18150f" font-size="18" x="1000" y="269">verdict and the score</text>
    <text fill="#5c5550" font-size="18" x="1000" y="308">enrichment data and</text>
    <text fill="#5c5550" font-size="18" x="1000" y="329">the curator loop</text>
    <text fill="#5c5550" font-size="18" x="1000" y="368">database lookup; the</text>
    <text fill="#5c5550" font-size="18" x="1000" y="389">label says which</text>
  <!-- enrichment -->
    <g>
      <rect x="488" y="376" width="470" height="32" rx="16" fill="#f4f1eb" stroke="#8a8278" stroke-width="1" stroke-dasharray="5 4"/>
