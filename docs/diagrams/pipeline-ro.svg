    </g>
    <g>
      <rect x="406" y="620" width="340" height="110" rx="8" fill="#1a56db" stroke="#15348f" stroke-width="1.5"/>
      <text fill="#ffffff" text-anchor="middle" font-size="18">
      <tspan x="576" y="648" font-family="'JetBrains Mono', monospace" font-weight="500">make_shortlist.py</tspan>
      <tspan x="576" y="670" font-family="'JetBrains Mono', monospace" font-weight="500">forgotten_words_shortlist.csv</tspan>
      <tspan x="576" y="692">listă restrânsă, scor euristic: 18.270</tspan>
      <tspan x="576" y="714">relevante 3.499 · curiozități 14.771</tspan>
      </text>
    </g>
    <g>
      <rect x="782" y="620" width="240" height="110" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
