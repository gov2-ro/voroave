    <path d="M746,675 H782" marker-end="url(#pl-arrow-a)"/>
    <path d="M1022,675 H1058" marker-end="url(#pl-arrow-a)"/>
  </g>

  <!-- phase 1 -->
    <g>
      <rect x="24" y="24" width="200" height="32" rx="16" fill="#eaf0ff" stroke="#1a56db" stroke-width="1"/>
      <text fill="#15348f" text-anchor="middle" font-size="18" font-weight="600" x="124.0" y="46">faza 1 · dicționar</text>
    </g>
    <g>
      <rect x="24" y="66" width="370" height="64" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="209" y="93" font-family="'JetBrains Mono', monospace" font-weight="500">dex-database.sql</tspan>
      <tspan x="209" y="115">dump MySQL dexonline, 1,65 GB</tspan>
      </text>
    </g>
    <g>
      <rect x="24" y="166" width="370" height="268" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" font-size="18" font-weight="600" x="38" y="190">cele patru baze ale dicționarului</text>
      <line x1="38" x2="380" y1="198" y2="198" stroke="#b9c8ec" stroke-width="1"/>
      <line x1="38" x2="380" y1="270" y2="270" stroke="#b9c8ec" stroke-width="1"/>
      <line x1="38" x2="380" y1="324" y2="324" stroke="#b9c8ec" stroke-width="1"/>
      <line x1="38" x2="380" y1="378" y2="378" stroke="#b9c8ec" stroke-width="1"/>
      <text fill="#18150f" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="500" x="38" y="216">lexemes.db</text>
      <text fill="#18150f" font-size="18" text-anchor="end" x="380" y="216">cuvinte, etichete</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="238">extract_lexemes.py +</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="260">extract_taxonomy.py</text>
      <text fill="#18150f" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="500" x="38" y="292">inflected_forms.db</text>
      <text fill="#18150f" font-size="18" text-anchor="end" x="380" y="292">forme flexionare</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="314">extract_inflected_forms.py</text>
      <text fill="#18150f" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="500" x="38" y="346">dict_sources.db</text>
      <text fill="#18150f" font-size="18" text-anchor="end" x="380" y="346">dicționare, ani</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="368">extract_dict_sources.py</text>
      <text fill="#18150f" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="500" x="38" y="400">definitions.db</text>
      <text fill="#18150f" font-size="18" text-anchor="end" x="380" y="400">definiții</text>
      <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="38" y="422">extract_definitions.py</text>
    </g>
    <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="122" y="459">lexemes.db</text>
    <g>
      <rect x="24" y="472" width="370" height="86" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="209" y="499" font-family="'JetBrains Mono', monospace" font-weight="500">create_curated_list.py</tspan>
      <tspan x="209" y="521" font-family="'JetBrains Mono', monospace" font-weight="500">forgotten_words_curated.csv</tspan>
      <tspan x="209" y="543">candidați: cuvintele de verificat</tspan>
      </text>
    </g>
  <!-- phase 2 -->
    <g>
      <rect x="468" y="24" width="186" height="32" rx="16" fill="#eaf0ff" stroke="#1a56db" stroke-width="1"/>
      <text fill="#15348f" text-anchor="middle" font-size="18" font-weight="600" x="561.0" y="46">faza 2 · corpusuri</text>
    </g>
    <rect x="468" y="96" width="265" height="180" rx="8" fill="none" stroke="#8a8278" stroke-width="1"/>
    <text fill="#18150f" font-size="18" font-weight="600" text-anchor="middle" x="600.5" y="120">panel istoric: 19,4 mil. tokens</text>
    <g>
      <rect x="478" y="130" width="245" height="64" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="600.5" y="157" font-family="'JetBrains Mono', monospace" font-weight="500">process_wikisource.py</tspan>
      <tspan x="600.5" y="179">Wikisource, 14,3 mil.</tspan>
      </text>
    </g>
    <g>
      <rect x="478" y="202" width="245" height="64" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="600.5" y="229" font-family="'JetBrains Mono', monospace" font-weight="500">process_lumro.py</tspan>
      <tspan x="600.5" y="251">romane LUMRO, 5,07 mil.</tspan>
      </text>
    </g>
    <rect x="749" y="96" width="265" height="108" rx="8" fill="none" stroke="#8a8278" stroke-width="1"/>
    <text fill="#18150f" font-size="18" font-weight="600" text-anchor="middle" x="881.5" y="120">panel modern</text>
    <g>
      <rect x="759" y="130" width="245" height="64" rx="8" fill="#eaf0ff" stroke="#1a56db" stroke-width="1.5"/>
      <text fill="#18150f" text-anchor="middle" font-size="18">
      <tspan x="881.5" y="157" font-family="'JetBrains Mono', monospace" font-weight="500">process_culturax.py</tspan>
      <tspan x="881.5" y="179">CulturaX, 16,97 mld.</tspan>
      </text>
    </g>
    <text fill="#5c5550" font-size="18" font-family="'JetBrains Mono', monospace" x="892" y="80">lexemes.db</text>
    <g>
