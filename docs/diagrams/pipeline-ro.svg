    <path d="M510,590 V520" marker-end="url(#pl-arrow-c)"/>
    <path d="M836,336 H984 V620" marker-end="url(#pl-arrow-c)"/>
  </g>

  <!-- B: display data and the curator loop -->
  <g fill="none" stroke="#5c5550" stroke-width="2" stroke-dasharray="7 5">
    <path d="M394,98 H426"/>
