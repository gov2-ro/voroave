    <text fill="#5c5550" font-size="18" x="1000" y="329">bucla curatorului</text>
    <text fill="#5c5550" font-size="18" x="1000" y="368">consultare de baze;</text>
    <text fill="#5c5550" font-size="18" x="1000" y="389">eticheta spune care</text>
  <!-- enrichment -->
