<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 922" width="1230" height="922"
  font-family="'Inter Tight', Inter, sans-serif" role="img" aria-labelledby="pl-title pl-desc" xml:lang="ro">
  <title id="pl-title">Cum ajunge un cuvânt în clasamentul Voroave</title>
  <desc id="pl-desc">Rangul unui cuvânt vine din compararea intrărilor de dicționar cu un panel istoric și unul modern de corpusuri; rezultatul este un clasament euristic de candidați. Sensurile, sinonimele și bucla curatorului nu intră în scor.</desc>
  <!-- opaque paper ground and its own thin edge: the PNG also sits on a dark page -->
  <rect x="0.75" y="0.75" width="1228.5" height="920.5" rx="6" fill="#fafaf8" stroke="#c8c1b7" stroke-width="1.5"/>
  <defs>
    <marker id="pl-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a56db"/></marker>
    <marker id="pl-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c5550"/></marker>
    <marker id="pl-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f675f"/></marker>
  </defs>

  <!-- C: database lookups. Trunk x=434, top run y=74, bottom run y=590 -->
