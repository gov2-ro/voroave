    <path d="M790,540 V520" marker-end="url(#pl-arrow-b)"/>
    <path d="M1040,540 V520" marker-end="url(#pl-arrow-b)"/>
    <path d="M680,520 V532"/>
    <path d="M680,532 A8,8 0 0 1 680,548" stroke-dasharray="none"/>
    <path d="M680,548 V558 H876 V620" marker-end="url(#pl-arrow-b)"/>
    <path d="M1120,520 V558 H1006 V620" marker-end="url(#pl-arrow-b)"/>
    <path d="M745,434 V416 H462"/>
