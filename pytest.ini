[pytest]
# Default discovery covers the current tests only. Archived suites stay available
# through an explicit path: `.venv/bin/python -m pytest archive -q` (known failures there).
testpaths = tests
norecursedirs = archive _obsolete node_modules .git .venv data public docs
# Apache checks need a local httpd with mod_rewrite. They are optional and stay out of
# the required run (F07: Apache deployment checks are separate). Run them with:
#   .venv/bin/python -m pytest tests -q -m apache
addopts = -m "not apache"
markers =
    apache: needs a local httpd with mod_rewrite; opt in with -m apache
